<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg { width: min(95vw, 95vh); height: min(95vw, 95vh); }
</style>
</head>
<body>
<svg viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1614"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e4a8"/>
      <stop offset="30%" stop-color="#c9a227"/>
      <stop offset="60%" stop-color="#e8c96a"/>
      <stop offset="100%" stop-color="#8d6d10"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e4a8"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8d6d10"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="innerCircle">
      <circle cx="280" cy="280" r="248"/>
    </clipPath>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="280" cy="280" r="278" fill="none" stroke="url(#goldRing)" stroke-width="1" opacity="0.4"/>

  <!-- Gold border ring outer -->
  <circle cx="280" cy="280" r="270" fill="url(#goldRing)" filter="url(#glow)"/>

  <!-- Main black circle -->
  <circle cx="280" cy="280" r="252" fill="url(#bgGrad)"/>

  <!-- Inner gold ring (thin accent) -->
  <circle cx="280" cy="280" r="252" fill="none" stroke="url(#goldRing)" stroke-width="2.5" opacity="0.7"/>
  <circle cx="280" cy="280" r="240" fill="none" stroke="url(#goldRing)" stroke-width="1" opacity="0.35"/>

  <!-- Divider line (horizontal) -->
  <line x1="70" y1="278" x2="490" y2="278" stroke="url(#goldRing)" stroke-width="1.5" opacity="0.6"/>

  <!-- ── ICONS SECTION (top half) ── -->

  <!-- SHAWARMA / WRAP (left) — rolled flatbread shape -->
  <g transform="translate(100,95)" opacity="0.95">
    <!-- outer wrap cone shape -->
    <path d="M34 20 Q20 22 14 50 Q8 78 12 120 Q16 138 34 142 Q52 146 60 128 Q68 110 66 82 Q64 54 54 28 Q48 14 34 20 Z" fill="none" stroke="#fff" stroke-width="2.2"/>
    <!-- top open end — lettuce/filling spilling out -->
    <path d="M22 32 Q34 18 48 30" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.8"/>
    <path d="M18 44 Q34 30 52 42" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <!-- wrap texture lines across body -->
    <path d="M13 70 Q38 62 65 70" fill="none" stroke="#fff" stroke-width="1.3" opacity="0.45"/>
    <path d="M12 88 Q38 80 66 88" fill="none" stroke="#fff" stroke-width="1.3" opacity="0.45"/>
    <path d="M12 106 Q38 98 66 106" fill="none" stroke="#fff" stroke-width="1.3" opacity="0.45"/>
    <!-- bottom fold -->
    <path d="M14 122 Q34 116 64 122" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.6"/>
    <!-- vertical center crease -->
    <path d="M34 22 Q32 82 34 140" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- COFFEE CUP (center) -->
  <g transform="translate(225,88)" opacity="0.95">
    <!-- steam lines -->
    <path d="M28 22 Q24 14 28 6 Q32 -2 28 -10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M42 18 Q38 10 42 2 Q46 -6 42 -14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M56 22 Q52 14 56 6 Q60 -2 56 -10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- cup body -->
    <path d="M10 40 L16 100 Q16 112 42 112 Q68 112 68 100 L74 40 Z" fill="none" stroke="#fff" stroke-width="2.5"/>
    <!-- saucer -->
    <ellipse cx="42" cy="116" rx="36" ry="8" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- handle -->
    <path d="M74 58 Q92 58 92 75 Q92 92 74 88" fill="none" stroke="#fff" stroke-width="2" fill-opacity="0"/>
    <!-- latte art hint -->
    <path d="M24 72 Q42 62 60 72" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- BUBBLE DRINK (right) -->
  <g transform="translate(355,102) scale(0.85)" opacity="0.95">
    <!-- cup body -->
    <path d="M12 30 L18 125 Q18 135 42 135 Q66 135 66 125 L72 30 Z" fill="none" stroke="#fff" stroke-width="2.5"/>
    <!-- lid -->
    <path d="M8 30 Q8 20 42 20 Q76 20 76 30 L72 30 L12 30 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- straw -->
    <line x1="50" y1="-5" x2="44" y2="135" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- bubbles -->
    <circle cx="24" cy="85" r="5" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.6"/>
    <circle cx="38" cy="100" r="4" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.6"/>
    <circle cx="56" cy="88" r="5" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.6"/>
    <circle cx="30" cy="108" r="3" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="52" cy="106" r="3.5" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- ── ARABIC TEXT SECTION (bottom half) ── -->
  <!-- Bottom arc subtle background tint -->
  <path d="M32 278 A248 248 0 0 0 528 278 Z" fill="url(#goldRing)" opacity="0.07" clip-path="url(#innerCircle)"/>

  <!-- Arabic text راشد علي -->
  <text
    x="280" y="395"
    text-anchor="middle"
    font-family="'Noto Naskh Arabic', serif"
    font-size="86"
    font-weight="700"
    fill="url(#goldText)"
    filter="url(#softGlow)"
    direction="rtl"
  >راشد علي</text>

  <!-- Decorative dots either side of text -->
  <circle cx="98" cy="430" r="3" fill="url(#goldRing)" opacity="0.6"/>
  <circle cx="108" cy="430" r="2" fill="url(#goldRing)" opacity="0.4"/>
  <circle cx="462" cy="430" r="3" fill="url(#goldRing)" opacity="0.6"/>
  <circle cx="452" cy="430" r="2" fill="url(#goldRing)" opacity="0.4"/>

  <!-- Subtitle · RASHED ALI · -->
  <text
    x="280" y="468"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif"
    font-size="17"
    font-weight="600"
    fill="url(#goldText)"
    letter-spacing="5"
    opacity="0.85"
  >· RASHED ALI ·</text>
</svg>
</body>
</html>
