<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0c0b09; padding: 24px; }
  .gold { color: #c9a227; }
  .cream { color: #faf8f3; }
  .muted { color: #8d6d10; }
  .tag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #6b5009; margin-bottom: 4px; }
  .row { margin-bottom: 18px; }
  .divider { border: none; border-top: 1px solid #211f1b; margin: 16px 0; }
</style>
</head>
<body>
  <div class="row">
    <div class="tag">Brand Display (Playfair Display)</div>
    <div style="font-family:'Playfair Display',serif; font-size:40px; font-weight:700;" class="gold">RASHED ALI</div>
    <div style="font-family:'Playfair Display',serif; font-size:22px; font-weight:400;" class="cream">Group of Companys</div>
  </div>
  <hr class="divider">
  <div class="row">
    <div class="tag">Arabic Display (Noto Naskh Arabic)</div>
    <div style="font-family:'Noto Naskh Arabic',serif; font-size:38px; font-weight:700; direction:rtl; text-align:right;" class="gold">راشد علي</div>
  </div>
  <hr class="divider">
  <div class="row">
    <div class="tag">Brand Label</div>
    <div style="font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.2em;" class="muted">· RASHED ALI CAFETERIAS ·</div>
  </div>
</body>
</html>
