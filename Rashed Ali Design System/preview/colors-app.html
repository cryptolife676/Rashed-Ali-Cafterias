<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .swatch { height: 52px; flex: 1; border-radius: 8px; display: flex; align-items: flex-end; padding: 5px 7px; }
  .swatch span { font-size: 10px; font-weight: 600; }
  .label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; margin-top: 10px; }
</style>
</head>
<body>
<div class="label">App Brand Blue</div>
<div class="row">
  <div class="swatch" style="background:#eef7ff; border:1px solid #d9ecff"><span style="color:#1a4fb3">50</span></div>
  <div class="swatch" style="background:#d9ecff"><span style="color:#1a4fb3">100</span></div>
  <div class="swatch" style="background:#2f7bff"><span style="color:#fff">500 ★</span></div>
  <div class="swatch" style="background:#1f63e0"><span style="color:#fff">600</span></div>
  <div class="swatch" style="background:#1a4fb3"><span style="color:#fff">700</span></div>
  <div class="swatch" style="background:#0f2a5e"><span style="color:#fff">900</span></div>
</div>
<div class="label">Slate Neutrals</div>
<div class="row">
  <div class="swatch" style="background:#f8fafc; border:1px solid #e2e8f0"><span style="color:#94a3b8">50</span></div>
  <div class="swatch" style="background:#f1f5f9; border:1px solid #e2e8f0"><span style="color:#94a3b8">100</span></div>
  <div class="swatch" style="background:#e2e8f0"><span style="color:#475569">200</span></div>
  <div class="swatch" style="background:#cbd5e1"><span style="color:#475569">300</span></div>
  <div class="swatch" style="background:#94a3b8"><span style="color:#fff">400</span></div>
  <div class="swatch" style="background:#64748b"><span style="color:#fff">500</span></div>
  <div class="swatch" style="background:#475569"><span style="color:#fff">600</span></div>
  <div class="swatch" style="background:#334155"><span style="color:#fff">700</span></div>
  <div class="swatch" style="background:#0f172a"><span style="color:#fff">900</span></div>
</div>
<div class="label">Semantic</div>
<div class="row">
  <div class="swatch" style="background:#d1fae5; flex:2"><span style="color:#059669">Income bg</span></div>
  <div class="swatch" style="background:#059669; flex:2"><span style="color:#fff">Income #059669</span></div>
  <div class="swatch" style="background:#fee2e2; flex:2"><span style="color:#dc2626">Expense bg</span></div>
  <div class="swatch" style="background:#dc2626; flex:2"><span style="color:#fff">Expense #dc2626</span></div>
  <div class="swatch" style="background:#fef3c7; flex:2"><span style="color:#d97706">Warn bg</span></div>
  <div class="swatch" style="background:#b45309; flex:2"><span style="color:#fff">Locked</span></div>
</div>
</body>
</html>
