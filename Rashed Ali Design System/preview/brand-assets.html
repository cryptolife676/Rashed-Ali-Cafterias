<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; font-family: 'Plus Jakarta Sans', sans-serif; color: #fff; padding: 40px; min-height: 100vh; }

  h1 { font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: rgba(201,162,39,0.7); margin-bottom: 36px; }

  .section { margin-bottom: 48px; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(201,162,39,0.45); margin-bottom: 14px; }

  .logo-row { display: flex; gap: 40px; align-items: center; }
  .logo-box { background: #111; border: 1px solid rgba(201,162,39,0.15); border-radius: 12px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .logo-box img { object-fit: contain; }
  .logo-box span { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: .08em; }

  .post-box { border: 1px solid rgba(201,162,39,0.2); border-radius: 12px; overflow: hidden; }
  .post-box img { width: 100%; display: block; }

  .favicon-box { background: #111; border: 1px solid rgba(201,162,39,0.15); border-radius: 12px; padding: 28px; display: flex; align-items: center; gap: 24px; }
  .favicon-sizes { display: flex; align-items: flex-end; gap: 20px; }
  .fav-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .fav-item span { font-size: 10px; color: rgba(255,255,255,0.35); }
</style>
</head>
<body>
  <h1>Rashed Ali — Brand Assets</h1>

  <div class="section">
    <div class="section-label">Logo — Upgraded Badge</div>
    <div class="logo-row">
      <div class="logo-box" style="background:#000">
        <img src="../assets/logo-upgraded.png" width="200" height="200">
        <span>On Black · 600×600px</span>
      </div>
      <div class="logo-box" style="background:#faf8f3">
        <img src="../assets/logo-upgraded.png" width="200" height="200">
        <span>On Cream</span>
      </div>
      <div class="logo-box" style="background:#1f63e0">
        <img src="../assets/logo-upgraded.png" width="200" height="200">
        <span>On Brand Blue</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Favicon</div>
    <div class="favicon-box">
      <div class="favicon-sizes">
        <div class="fav-item">
          <img src="../assets/favicon-upgraded.png" width="64" height="64">
          <span>64px</span>
        </div>
        <div class="fav-item">
          <img src="../assets/favicon-upgraded.png" width="48" height="48">
          <span>48px</span>
        </div>
        <div class="fav-item">
          <img src="../assets/favicon-upgraded.png" width="32" height="32">
          <span>32px</span>
        </div>
        <div class="fav-item">
          <img src="../assets/favicon-upgraded.png" width="16" height="16">
          <span>16px</span>
        </div>
      </div>
      <div style="font-size:12px; color:rgba(255,255,255,0.4); max-width:280px; line-height:1.6; margin-left:20px;">
        Gold "RA" monogram on black circle with gold ring. Use <code style="background:#222;padding:2px 6px;border-radius:4px;font-size:11px">favicon-upgraded.png</code> as your browser favicon.
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Website Post Image — 1200 × 628px (Social Share Ready)</div>
    <div class="post-box">
      <img src="../assets/website-post.png" alt="Website Post">
    </div>
  </div>
</body>
</html>
