<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .swatch { height: 56px; flex: 1; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px 8px; }
  .swatch span { font-size: 10px; font-weight: 600; }
  .label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; margin-top: 8px; }
</style>
</head>
<body>
<div class="label">Brand Gold</div>
<div class="row">
  <div class="swatch" style="background:#fdf6e3"><span style="color:#b08a1a">100</span></div>
  <div class="swatch" style="background:#f5e4a8"><span style="color:#8d6d10">200</span></div>
  <div class="swatch" style="background:#e8c96a"><span style="color:#6b5009">300</span></div>
  <div class="swatch" style="background:#d4a93a"><span style="color:#fff">400</span></div>
  <div class="swatch" style="background:#c9a227"><span style="color:#fff">500 ★</span></div>
  <div class="swatch" style="background:#b08a1a"><span style="color:#fff">600</span></div>
  <div class="swatch" style="background:#8d6d10"><span style="color:#fff">700</span></div>
  <div class="swatch" style="background:#6b5009"><span style="color:#fff">800</span></div>
  <div class="swatch" style="background:#3e2e04"><span style="color:#c9a227">900</span></div>
</div>
<div class="label">Brand Black & Cream</div>
<div class="row">
  <div class="swatch" style="background:#0c0b09; flex:2"><span style="color:#c9a227">Brand Black #0c0b09</span></div>
  <div class="swatch" style="background:#1a1814; flex:2"><span style="color:#c9a227">Black Soft #1a1814</span></div>
  <div class="swatch" style="background:#211f1b; flex:2"><span style="color:#c9a227">Card #211f1b</span></div>
  <div class="swatch" style="background:#faf8f3; border:1px solid #e2d8c4; flex:2"><span style="color:#8d6d10">Cream #faf8f3</span></div>
</div>
</body>
</html>
