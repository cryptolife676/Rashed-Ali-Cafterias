<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding: 24px; }
  .row { margin-bottom: 12px; display: flex; align-items: baseline; gap: 16px; }
  .meta { font-size: 10px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; width: 100px; flex-shrink: 0; }
  .divider { border: none; border-top: 1px solid #e2e8f0; margin: 12px 0; }
</style>
</head>
<body>
  <div class="row"><span class="meta">2xl / 600</span><span style="font-size:24px;font-weight:600;color:#0f172a">Dashboard</span></div>
  <div class="row"><span class="meta">xl / 600</span><span style="font-size:20px;font-weight:600;color:#0f172a">Last 12 Months</span></div>
  <div class="row"><span class="meta">lg / 500</span><span style="font-size:18px;font-weight:500;color:#0f172a">Active Shareholders</span></div>
  <hr class="divider">
  <div class="row"><span class="meta">sm / 400</span><span style="font-size:14px;font-weight:400;color:#475569">Rashed Ali Cafeteria</span></div>
  <div class="row"><span class="meta">xs / 600 caps</span><span style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.08em">INCOME (MTD)</span></div>
  <div class="row"><span class="meta">xs / 400 muted</span><span style="font-size:12px;font-weight:400;color:#94a3b8">No transactions yet</span></div>
  <hr class="divider">
  <div class="row"><span class="meta">tabular mono</span><span style="font-size:24px;font-weight:600;color:#0f172a;font-variant-numeric:tabular-nums">AED 12,450.00</span></div>
</body>
</html>
