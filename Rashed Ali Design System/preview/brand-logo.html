<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; padding: 20px; display: flex; gap: 24px; align-items: center; }
  .logo { width: 110px; height: 110px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(201,162,39,0.4)); }
  .text-block { display: flex; flex-direction: column; gap: 6px; }
  .quote { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 400; font-style: italic; color: #fff; line-height: 1.35; max-width: 260px; }
  .quote em { color: #c9a227; font-style: normal; font-weight: 700; }
  .sub { font-size: 10px; font-weight: 600; letter-spacing: .2em; color: rgba(201,162,39,0.4); text-transform: uppercase; margin-top: 10px; }
</style>
</head>
<body>
  <img class="logo" src="../assets/logo-badge.png" alt="Logo">
  <div class="text-block">
    <div class="quote">"Every bite tells a <em>story</em> worth savouring."</div>
    <div class="sub">· Rashed Ali Cafeterias ·</div>
  </div>
</body>
</html>
