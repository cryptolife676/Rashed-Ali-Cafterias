<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding: 20px; }

  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 2px 0 rgb(0 0 0/.05); border: 1px solid #e2e8f0; padding: 20px; }
  h2 { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 14px; }
  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #64748b; padding: 6px 10px; border-bottom: 1px solid #e2e8f0; }
  td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; color: #334155; }
  tr:last-child td { border-bottom: none; }
  .income { color: #059669; font-weight: 500; }
  .expense { color: #dc2626; font-weight: 500; }
  .locked { font-size: 11px; color: #b45309; background: #fef3c7; padding: 2px 6px; border-radius: 4px; }
  .nums { font-variant-numeric: tabular-nums; text-align: right; }
</style>
</head>
<body>
<div class="card">
  <h2>Recent Transactions</h2>
  <table>
    <thead>
      <tr><th>Date</th><th>Kind</th><th>Category</th><th>Branch</th><th style="text-align:right">Amount</th><th>Notes</th><th></th></tr>
    </thead>
    <tbody>
      <tr><td>12 Apr 2025</td><td><span class="income">income</span></td><td>Food Sales</td><td>Main</td><td class="nums">AED 3,200</td><td style="color:#94a3b8">Lunch service</td><td></td></tr>
      <tr><td>11 Apr 2025</td><td><span class="expense">expense</span></td><td>Supplies</td><td>Main</td><td class="nums">AED 850</td><td style="color:#94a3b8">Vegetable order</td><td><span class="locked">locked</span></td></tr>
      <tr><td>10 Apr 2025</td><td><span class="income">income</span></td><td>Beverages</td><td>Branch 2</td><td class="nums">AED 1,100</td><td style="color:#94a3b8"></td><td></td></tr>
      <tr><td>09 Apr 2025</td><td><span class="expense">expense</span></td><td>Utilities</td><td>Main</td><td class="nums">AED 620</td><td style="color:#94a3b8">Electricity</td><td></td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
